[project]
name = "fastindex"
version = "0.1.0"
description = "Vectorless first-order log-n retrieval for OKF wiki trees — reason through the hierarchy, skip the vector DB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "litellm>=1.60",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "rank-bm25>=0.2.2",
  "huggingface_hub>=0.23",
]
evals = [
  "rank-bm25>=0.2.2",
  "huggingface_hub>=0.23",
]
kg = [
  "cognee>=1.4.0",
]
# Alias kept for older commands
bench = [
  "rank-bm25>=0.2.2",
  "huggingface_hub>=0.23",
]

[project.scripts]
fastindex = "fastindex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
